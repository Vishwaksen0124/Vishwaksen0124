<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" fill="none" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#1b2230" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="60%" stop-color="#1f6feb" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- base -->
  <rect width="1000" height="250" fill="#0d1117"/>
  <rect width="1000" height="250" fill="url(#grid)" opacity="0.6"/>
  <rect width="1000" height="250" fill="url(#glow)"/>

  <!-- left accent bar -->
  <rect x="64" y="66" width="5" height="118" rx="2.5" fill="url(#accent)"/>

  <!-- kicker -->
  <text x="92" y="76" font-size="14" font-weight="600" letter-spacing="3" fill="#58a6ff">SOFTWARE ENGINEER</text>

  <!-- name -->
  <text x="90" y="132" font-size="56" font-weight="800" letter-spacing="-1" fill="#e6edf3">Pujala Vishwaksen</text>

  <!-- subtitle -->
  <text x="92" y="168" font-size="19" font-weight="500" fill="#8b949e">Backend &#183; Distributed Systems &#183; Agentic AI</text>

  <!-- focus chips (monospace) -->
  <g font-family="'JetBrains Mono','SF Mono',Consolas,monospace" font-size="13" fill="#7d8590">
    <text x="92" y="206">FastAPI</text>
    <text x="162" y="206" fill="#30363d">/</text>
    <text x="176" y="206">Celery + Redis</text>
    <text x="288" y="206" fill="#30363d">/</text>
    <text x="302" y="206">AWS</text>
    <text x="340" y="206" fill="#30363d">/</text>
    <text x="354" y="206">LangGraph</text>
    <text x="438" y="206" fill="#30363d">/</text>
    <text x="452" y="206">Python</text>
  </g>

  <!-- bottom rule -->
  <rect x="90" y="224" width="820" height="2" fill="url(#rule)"/>

  <!-- corner mark -->
  <text x="936" y="222" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="12" letter-spacing="1" fill="#484f58">@Vishwaksen0124</text>
</svg>
